[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-predictor"
version = "1.0.0"
description = "Heart disease risk prediction with a validated sklearn pipeline and SHAP explanations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md Faiz Alam" }]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2.3",
    "scikit-learn>=1.6",
    # CPU-only wheel avoids ~200 MB of NVIDIA NCCL libraries on Linux; same `xgboost` module.
    "xgboost-cpu>=2.1; sys_platform != 'darwin'",
    "xgboost>=2.1; sys_platform == 'darwin'",
    "lightgbm>=4.5",
    "shap>=0.46",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "joblib>=1.4",
    "streamlit>=1.40",
    "pydantic-settings>=2.4",
    "plotly>=5.24",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
train = ["optuna>=4.0", "mlflow>=2.17"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "httpx>=0.27", "ipykernel>=6.29", "nbconvert>=7.16", "seaborn>=0.13.2"]

[project.scripts]
heart-train = "heart.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: runs a real (small) training job; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"src/heart/evaluate.py" = ["E501"]  # model-card markdown template

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["heart"]
omit = ["src/heart/ui/*"]

# Install once:  pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  # ruff and mypy run from the project venv, so hooks, CI and editors use one version.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
